spring.application.name=llm-rag-portfolio

# ---------- 파일 업로드 ----------
# 기본값은 1MB 라서 대부분의 PDF 가 막힌다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# 한도를 넘는 파일을 보냈을 때 연결이 끊기지 않고 413 응답을 받기 위한 설정
server.tomcat.max-swallow-size=-1

app.storage.upload-dir=uploads

# ---------- Oracle ----------
# 비밀번호는 코드에 적지 말고 환경변수 DB_PASSWORD 로 넘긴다.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:rag}
spring.datasource.password=${DB_PASSWORD}
